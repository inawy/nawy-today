name: ci

on:
  push:
    branches-ignore: [ci/probe-deps]
  pull_request:

permissions:
  contents: write # only used by the one-time lockfile bootstrap step below (D-015)

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect lockfile
        id: lock
        run: |
          if [ -f package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install
        run: |
          if [ "${{ steps.lock.outputs.present }}" = "true" ]; then
            bash tools/ci-run.sh install npm ci
          else
            bash tools/ci-run.sh install npm install
          fi

      # One-time bootstrap: the authoring sandbox cannot reach npm, so CI generates the
      # lockfile and commits it back. Delete this step once package-lock.json exists.
      - name: Commit generated lockfile
        if: steps.lock.outputs.present == 'false' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json (generated by CI)"
          git push

      - name: Lint
        run: bash tools/ci-run.sh lint npm run lint
      - name: Format check
        run: bash tools/ci-run.sh format npm run format:check
      - name: Test
        run: bash tools/ci-run.sh test npm test
      - name: Build
        run: bash tools/ci-run.sh build npm run build
