name: ci

on:
  push:
    branches-ignore: [ci/probe-deps]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lockfile in sync
        run: bash tools/check-lockfile.sh
      - name: Install
        run: bash tools/ci-run.sh install npm ci

      - name: Lint
        run: bash tools/ci-run.sh lint npm run lint
      - name: Format check
        run: bash tools/check-format.sh
      - name: Test
        run: bash tools/ci-run.sh test npm test
      - name: Build
        run: bash tools/ci-run.sh build npm run build
      - name: Dist checks (CSP, no inline script, brand token)
        run: bash tools/ci-run.sh dist node tools/check-dist.mjs
      - name: Bundle size report (not a gate yet)
        run: bash tools/ci-run.sh bundle node tools/measure/bundle-size.mjs
      - name: Install Playwright browser
        run: bash tools/ci-run.sh playwright-install npx playwright install --with-deps chromium
      - name: End-to-end (production build in a real browser)
        run: bash tools/ci-run.sh e2e npm run e2e
      - name: Upload e2e traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
