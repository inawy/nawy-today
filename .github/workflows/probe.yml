name: probe-deps
on:
  push:
    branches: [ci/probe-deps]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm --version
      - run: node tools/probe-deps.mjs
